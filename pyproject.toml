[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-photo-restoration-studio"
version = "0.6.4"
description = "Offline AI photo restoration for Windows — denoise, deblur, colorize, upscale, restore."
readme = "docs/OVERVIEW.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The Restoration Studio contributors" }]
keywords = ["photo-restoration", "onnx", "upscale", "colorize", "denoise", "desktop", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
photo-restore = "app.cli:main"

[project.urls]
Homepage = "https://github.com/photo-restoration-studio/ai-photo-restoration-studio"
Issues = "https://github.com/photo-restoration-studio/ai-photo-restoration-studio/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/core", "app/models", "app/utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"